<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<body>
  <h1>Student Registration Form</h1><h1>
    <form>
        <fieldset>
            <legend>Student Information</legend><legend>

                <label>
                    Name:
                    <input type="text" placeholder="Avinashhh Singh">


                </label>
                <br>
                <label for="email">
                    Email:
                    </label>
                    <input type="email" id="email" placeholder="avinashh19@gmail.com">

                    <br>
                    <label for="phone no">
                        Phone no:
                    </label>
                    <input type="pho" id="pho" placeholder="6203422313">

                    <label for="dob">
                        Date of Birth:
                    </label>
                    <input type="date" id="dob">
                    </fieldset>

                    <br>
                    <fieldset

                    <legend>Gender Information</legend>
                    <label>

                        <input type="radio" id="male">
                        Male
                        </label>
                        
                        <input type="radio" id="female">
                        female
                    </label>
                    <label>
                        <input type="radio">
                        Other
                    </label>
        </fieldset>
        <br>
        <br>
        <fieldset>
            <legend>Course Information</legend>
        <label for="course">
            Select Course:
            </label>
            
            <select id="course">
                <option>MERN</option>
            <option>DSA</option>
            <option>AI</option>
            <option>CLOUD</option>
            </select>
        </fieldset>
    </form>
    
</body>
</html>
