<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Position Boxes</title>

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            padding: 20px;
            font-family: Arial, sans-serif;
        }

        .parent{
            width: 100%;
            height: 800px;
            position: relative;
            background-color: #f5f5f5;
        }

        .box{
            display: inline-block;
            width: 200px;
            height: 200px;
            color: black;
            font-size: 22px;
            padding: 10px;
            border: 2px solid black;
        }

        /* Box 1 */
        .static{
            background-color: red;
        }

        /* Box 2 */
        .relative{
            position: relative;
            right: 20px;
            background-color: green;
        }

        /* Box 3 */
        .absolute{
            position: absolute;
            top: 0;    e\ 
                
            left: 420px;
            background-color: blue;
        }

        /* Box 4 */
        .fixed{
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: yellow;
        }

        /* Box 5 */
        .sticky{
            position: sticky;
            top: 100px;
            background-color: peachpuff;
        }

    </style>
</head>

<body>

    <div class="parent">

        <div class="box static">Box 1</div> `       *+

        <div class="box relative">Box 2</div>

        <div class="box absolute">Box 3</div>

        <div class="box fixed">Box 4</div>

        <div class="box sticky">Box 5</div>

    </div>

</body>
</html>
