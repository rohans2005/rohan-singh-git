<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4x4 Grid</title>

<style>
.container{
    width:800px;
    height:500px;
    border:2px solid black;

    display:grid;
    grid-template-columns:repeat(4,1fr);
    grid-template-rows:repeat(4,1fr);
}

.box{
    width:80px;
    height:50px;
    background:lightblue;
    border:1px solid black;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* Four corners */
.top-left{
    grid-row:1;
    grid-column:1;
    justify-self:start;
    align-self:start;
}

.top-right{
    grid-row:1;
    grid-column:4;
    justify-self:end;
    align-self:start;
}

.bottom-left{
    grid-row:4;
    grid-column:1;
    justify-self:start;
    align-self:end;
}

.bottom-right{
    grid-row:4;
    grid-column:4;
    justify-self:end;
    align-self:end;
}
</style>
</head>
<body>

<div class="container">
    <div class="box top-left">1</div>
    <div class="box top-right">2</div>
    <div class="box bottom-left">3</div>
    <div class="box bottom-right">4</div>
</div>

</body>
</html>
