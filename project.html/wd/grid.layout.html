<!DOCTYPE html>
<html>
<head>
<style>
.container{
    width:800px;
    height:500px;
    border:2px solid brown;

    display:grid;
    grid-template-columns:repeat(4,1fr);
    grid-template-rows:repeat(4,1fr);
}

.box{
    width:50px;
    height:50px;
    background:red;
}


.b1,.b5,.b9,.b13{
    justify-self:start;
    align-self:start;
    background: red;
}


.b2,.b6,.b10,.b14{
    justify-self:center;
    align-self:start;
    background:#e85b5b;
}


.b3,.b7,.b11,.b15{
    justify-self:end;
    align-self:start;
    background:#d62828;
}
</style>
</head>
<body>

<div class="container">

    <div class="box b1"></div>
    <div class="box b2"></div>
    <div class="box b3"></div>
    <div></div>

    <div class="box b5"></div>
    <div class="box b6"></div>
    <div class="box b7"></div>
    <div></div>

    <div class="box b9"></div>
    <div class="box b10"></div>
    <div class="box b11"></div>
    <div></div>

    <div class="box b13"></div>
    <div class="box b14"></div>
    <div class="box b15"></div>
    <div></div>

    <div></div>
    <div></div>
    <div></div>
    <div></div>

</div>

</body>
</html>
