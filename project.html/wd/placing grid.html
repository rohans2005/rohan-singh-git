<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Grid Example</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
    }

    body{
        display:flex;
        justify-content:center;
        align-items:center;
        min-height:100vh;
        background:#f4f4f4;
        font-family:Arial, sans-serif;
    }

    .container{
        width:800px;
        display:grid;
        grid-template-columns:repeat(4,1fr);
        grid-template-rows:100px 100px 100px;
        gap:10px;
    }

    .item{
        display:flex;
        justify-content:center;
        align-items:center;
        color:white;
        font-size:24px;
        font-weight:bold;
        border-radius:5px;
    }

    /* A spans 2 columns */
    .a{
        background:#3949ab;
        grid-column:1/3;
        grid-row:1;
    }

    /* B spans 2 rows */
    .b{
        background:#9575cd;
        grid-column:3;
        grid-row:1/3;
    }

    .c{
        background:#81c784;
        grid-column:4;
        grid-row:1;
    }

    .d{
        background:#f57c00;
        grid-column:1/3;
        grid-row:2;
    }

    .e{
        background:white;
        color:black;
        border:2px solid #ccc;
        grid-column:4;
        grid-row:2;
    }

    /* F spans full width */
    .f{
        background:#29b6f6;
        grid-column:1/5;
        grid-row:3;
    }
</style>
</head>

<body>

<div class="container">
    <div class="item a">A</div>
    <div class="item b">B</div>
    <div class="item c">C</div>
    <div class="item d">D</div>
    <div class="item e">E</div>
    <div class="item f">F</div>
</div>

</body>
</html>
