<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grid Structure</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

.container{
    width:800px;
    height:500px;
    border:2px solid black;
    display:grid;
    grid-template-columns: 1fr 150px 2fr;
    grid-template-rows: repeat(4,1fr);
    gap:10px;
    padding:10px;
}

.green{
    background:lime;
    grid-column:1;
    grid-row:1/3;
}

.red{
    background:red;
}

.yellow{
    background:yellow;
}

.pink{
    background:deeppink;
}

.blue{
    background:blue;
}

.purple{
    background:blueviolet;
    grid-column:2;
    grid-row:1/5;
}

.white{
    background:white;
    border:1px solid gray;
    grid-column:3;
    grid-row:1/5;
}
</style>

</head>
<body>

<div class="container">
    <div class="green"></div>
    <div class="red"></div>
    <div class="yellow"></div>
    <div class="pink"></div>
    <div class="blue"></div>
    <div class="purple"></div>
    <div class="white"></div>
</div>

</body>
</html>
