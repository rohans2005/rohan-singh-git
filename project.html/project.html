<!DOCTYPE html>
<html lang="en">
<head>
    <title>College Time Table</title>

    <style>

        table{
            border-collapse: collapse;
            text-align: center;
            margin: auto;
            margin-top: 50px;
        }

        th,td{
            border: 2px solid black;
            padding: 15px;
        }

    </style>
</head>

<body>

    <table>

        <!-- Title Row -->
        <tr>
            <th colspan="5">COLLEGE TIME TABLE</th>
        </tr>

        <!-- Heading Row -->
        <tr>
            <th>DAY</th>
            <th>8-9</th>
            <th>9-10</th>
            <th>10-11</th>
            <th>11-12</th>
        </tr>

        <!-- Monday Row -->
        <tr>
            <td>MON</td>
            <td>HTML</td>
            <td>CSS</td>
            <td colspan="2">JS</td>
        </tr>

        <!-- Tuesday Row -->
        <tr>
            <td>TUE</td>
            <td colspan="2">React</td>
            <td colspan="2">SQL</td>
        </tr>

    </table>

</body>
</html>
