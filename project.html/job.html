<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Job Application Form</title>
</head>
<body>
    <!--header-->
<h1>Job Application Form</h1>

<main>
    <form>
        <!--Personal Information-->
        <fieldset>
            <legend>Personal Information</legend>
           
            <label for="name">Name:</label>
            <input type="text" id="name" placeholder="Avinashhh Singh">
            <br>
            <label for="email">Email:</label>
            <input type="email" id="email" placeholder="avinashsingh@gmail.com">
            <br>
            <label for="phone">Phone No:</label>
            <input type="tel" id="phone" placeholder="6203422313">
            <br>
            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob">
        </fieldset>

        <!-- Gender Information-->
         <fieldset>
            <legend>Gender Information </legend>

            <input type="radio" id="female" name="gender">
            <label for="Female">Female</label>
            <input type="radio" id="male" name="gender">
            <label for="Male">Male</label>
            <input type="radio" id="other" name="gender">
            <label for="other">Other</label>    
            </fieldset>

                <!--Skills -->
                <fieldset>
                    <legend>Skills</legend>
                    <label>Select Your skills:</label><br>
                    <input type="checkbox" id="html">
                    <label for="html">HTML</label>
                    <br>
                    <input type="checkbox" id="css">
                    <label for="css">CSS</label>
                    <br>
                    <input type="checkbox" id="javascript">
                    <label for="javascript">JavaScript</label>
                    <br>
                    <input type="checkbox" id="python">
                    <label for="python">Python</label>
                    <br>
                </fieldset>

                <!-- Additional Information-->
                <fieldset>
                    <legend>Additional Information</legend>
                    <label for="experience">Years of Experience:</label>
                    <select id="experience">
                        <option disabled selected>-- Select --</option>
                        <option>1 Year</option>
                        <option>2 Years</option>
                        <option>3+ Years</option>
                        
                    </select>
                    <br>
                    <label for="location">Preferred Job Location:</label>
                    <select id="location">
                        <option disabled selected>-- Select City --</option>
                        <option value="in">Indore</option>
                        <option value="vd">Vadodara</option>
                        <option value="hyd">Hyderabad</option>
                        <option value="nd">Noida</option>
                       </select>
                       <br>
                       <label for="resume">Upload Resume:</label>
                       <input type="file" maxlength="10MB" accept=".pdf,.htm">
                </fieldset>
                <button>Submit</button>
                <button>Reset</button>

</form>
</main>
    
</body>
</html>
